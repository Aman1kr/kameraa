name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            preset: windows
          - name: Linux
            os: ubuntu-latest
            preset: linux
          - name: macOS
            os: macos-latest
            preset: macos

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf automake libtool \
            libgl1-mesa-dev libxkbcommon-dev libx11-dev libxext-dev \
            '^libxcb.*-dev' libglu1-mesa-dev

      - name: Install Ninja (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'e456309491fd875487bf02b8a0dca76c1b1b00cc'

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DKAMERAA_BUILD_TESTS=ON
          -DVCPKG_MANIFEST_FEATURES=tests

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure

      - name: Package
        run: cmake --build --preset ${{ matrix.preset }} --config Release --target package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kameraa-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/*.zip
            build/${{ matrix.preset }}/*.tar.gz
            build/${{ matrix.preset }}/*.deb
          if-no-files-found: ignore
