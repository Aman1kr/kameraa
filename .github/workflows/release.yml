name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            preset: windows
          - name: Linux
            os: ubuntu-latest
            preset: linux
          - name: macOS
            os: macos-latest
            preset: macos

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf automake libtool \
            libgl1-mesa-dev libxkbcommon-dev libx11-dev libxext-dev \
            '^libxcb.*-dev' libglu1-mesa-dev fuse

      - name: Install Ninja (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'e456309491fd875487bf02b8a0dca76c1b1b00cc'

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DKAMERAA_BUILD_TESTS=ON
          -DVCPKG_MANIFEST_FEATURES=tests

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config Release

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure

      - name: Package (CPack)
        run: cmake --build --preset ${{ matrix.preset }} --config Release --target package

      # NOTE: signing/notarization require your certificates/secrets and are left
      # as documented manual/secret-driven steps (see release/RELEASE_CHECKLIST.md).

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/${{ matrix.preset }}/*.zip dist/ 2>/dev/null || true
          cp build/${{ matrix.preset }}/*.tar.gz dist/ 2>/dev/null || true
          cp build/${{ matrix.preset }}/*.deb dist/ 2>/dev/null || true
          ls -la dist || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kameraa-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
