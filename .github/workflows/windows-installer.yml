name: Windows Installer

# Produces a downloadable Kameraa-Setup-<version>.exe. Run it from the GitHub
# "Actions" tab (Run workflow) or by pushing a v* tag. Download the installer from
# the run's "Artifacts" section when it finishes.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  installer:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (vcpkg)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'e456309491fd875487bf02b8a0dca76c1b1b00cc'

      - name: Set up MSVC environment (for Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake --preset windows
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Release)
        run: cmake --build --preset windows --config Release

      - name: Prepare deploy folder (app + Qt runtime + models)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build\windows -Filter kameraa.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw "Build output kameraa.exe not found under build\windows" }
          Write-Host "Found app: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item $exe.FullName deploy\
          New-Item -ItemType Directory -Force -Path deploy\models | Out-Null
          Copy-Item models\manifest.json deploy\models\

          # Find windeployqt from the vcpkg-installed Qt and bundle Qt runtime.
          $wd = Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Filter windeployqt.exe `
            -Path build\windows\vcpkg_installed, vcpkg_installed, vcpkg | Select-Object -First 1
          if ($null -eq $wd) { throw "windeployqt.exe not found in vcpkg Qt install." }
          Write-Host "Using $($wd.FullName)"
          & $wd.FullName --release --no-translations --no-opengl-sw --dir deploy deploy\kameraa.exe

          # Bundle non-Qt runtime DLLs (OpenCV, spdlog + their dependencies) from
          # the vcpkg release bin folder — windeployqt does not copy these.
          $vcpkgBin = Get-ChildItem -Recurse -Directory -Path build\windows\vcpkg_installed `
            -Filter bin -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64-windows\\bin$' } | Select-Object -First 1
          if ($null -eq $vcpkgBin) { throw "vcpkg x64-windows\bin not found." }
          Write-Host "Copying runtime DLLs from $($vcpkgBin.FullName)"
          Copy-Item "$($vcpkgBin.FullName)\*.dll" deploy\ -Force
          Write-Host "Deploy folder now contains $((Get-ChildItem deploy -Filter *.dll).Count) DLLs."

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v\d') { $v = $v.TrimStart('v') } else { $v = "1.0.0-dev" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            packaging\windows\kameraa.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kameraa-Windows-Installer
          path: packaging/windows/Output/*.exe
          if-no-files-found: error
